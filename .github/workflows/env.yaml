
name: Environment Variable Scope
on: workflow_dispatch

env:
  MESSAGE: workflow

jobs:
  workflow-level:
    runs-on: ubuntu-latest
    steps:
      - name: Workflow environment
        run: echo "$MESSAGE"

  job-level:
    runs-on: ubuntu-latest
    env:
      MESSAGE: job
    steps:
      - name: Job environment
        run: echo "$MESSAGE"

      - name: Step environment
        env:
          MESSAGE: step
        run: echo "$MESSAGE"

      - name: Check job environment
        run: echo "$MESSAGE"
